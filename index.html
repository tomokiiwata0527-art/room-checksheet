<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>居室チェック管理 - 京王多摩川開発B棟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Firebase（USE_FIREBASEをtrueにして使う場合のみ有効になります。falseなら読み込まれるだけで何もしません） -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#eceae2;
    --surface:#ffffff;
    --ink:#1b1d1e;
    --ink-soft:#5b5f61;
    --line:#cdc7b8;
    --navy:#14314f;
    --navy-deep:#0c2038;
    --orange:#e2711d;
    --yellow:#f0b429;
    --green:#2e7d46;
    --green-bg:#e4f1e7;
    --red:#b3261e;
    --red-bg:#f7e3e1;
    --grey-bg:#e2ded2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',sans-serif;-webkit-font-smoothing:antialiased;}
  .num{font-family:'Barlow Condensed',sans-serif;font-weight:700;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}
  ::selection{background:var(--yellow);}

  /* ---- App shell ---- */
  #app{max-width:960px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:40px;}

  .topbar{background:var(--navy);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .site-title{display:flex;flex-direction:column;line-height:1.1;}
  .site-title .eyebrow{font-size:11px;letter-spacing:.04em;color:#9db3c9;font-weight:500;}
  .site-title .name{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;letter-spacing:.01em;}
  .topbar-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .icon-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:7px 10px;font-size:12.5px;display:flex;align-items:center;gap:5px;white-space:nowrap;}
  .icon-btn:active{background:rgba(255,255,255,.22);}

  .progress-wrap{margin-top:12px;}
  .progress-num{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
  .progress-num .big{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;}
  .progress-num .sub{font-size:12px;color:#b9c7d5;}
  .progress-bar{height:8px;border-radius:5px;background:rgba(255,255,255,.16);overflow:hidden;display:flex;}
  .progress-bar>div{height:100%;}
  .progress-legend{display:flex;gap:14px;margin-top:8px;font-size:11px;color:#c7d3de;}
  .progress-legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  .filters{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--navy-deep);}
  .filters::-webkit-scrollbar{display:none;}
  .chip-filter{flex:0 0 auto;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#dbe4ec;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:500;}
  .chip-filter.active{background:var(--orange);border-color:var(--orange);color:#fff;}

  .content{padding:14px 14px 0;}

  /* room grid */
  .floor-block{margin-bottom:18px;}
  .floor-head{display:flex;align-items:center;gap:8px;margin:0 2px 8px;}
  .floor-head .fnum{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;color:var(--navy);}
  .floor-head .fcount{font-size:11.5px;color:var(--ink-soft);}
  .room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;}
  .room-chip{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 6px 8px;text-align:center;position:relative;}
  .room-chip .no{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;line-height:1;}
  .room-chip .stat-label{font-size:10px;margin-top:4px;font-weight:500;}
  .room-chip .bar{height:4px;border-radius:2px;background:var(--grey-bg);margin-top:6px;overflow:hidden;}
  .room-chip .bar>div{height:100%;}
  .room-chip.st-none{border-color:var(--line);}
  .room-chip.st-vendor .no{color:var(--yellow-ink,#8a5c00);}
  .room-chip.st-partial{border-color:#e7c98a;}
  .room-chip.st-done{border-color:var(--green);background:var(--green-bg);}
  .room-chip .badge{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;}

  .empty-state{padding:60px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state .big{font-family:'Barlow Condensed',sans-serif;font-size:22px;color:var(--navy);margin-bottom:8px;}
  .cta-btn{background:var(--orange);color:#fff;border:none;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:700;margin-top:14px;}

  /* ---- Detail view ---- */
  .detail-header{background:var(--navy);color:#fff;padding:14px 16px 18px;}
  .back-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .back-btn{background:none;border:none;color:#cdd9e3;font-size:13px;display:flex;align-items:center;gap:4px;padding:4px 0;}
  .detail-title{display:flex;align-items:flex-end;justify-content:space-between;}
  .detail-title .no{font-family:'Barlow Condensed',sans-serif;font-size:52px;font-weight:700;line-height:1;}
  .detail-title .suffix{font-size:15px;color:#b9c7d5;margin-left:4px;}
  .detail-actions{display:flex;gap:6px;}

  .info-card{background:var(--surface);margin:-10px 14px 0;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.08);padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:2;}
  .info-field{display:flex;flex-direction:column;gap:2px;}
  .info-field.full{grid-column:1/-1;}
  .info-field label{font-size:10.5px;color:var(--ink-soft);font-weight:500;}
  .info-field input{border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:13.5px;font-family:inherit;background:#fbfaf7;}
  .info-field input:focus{outline:2px solid var(--orange);outline-offset:-1px;}

  .checklist{padding:14px 14px 0;}
  .group-head{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 6px;padding-top:6px;}
  .group-head:first-child{margin-top:0;padding-top:0;}
  .group-head .gname{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--navy);letter-spacing:.02em;}
  .group-chip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .group-chip.none{background:var(--grey-bg);color:var(--ink-soft);}
  .group-chip.partial{background:#fdf6e3;color:#8a5c00;}
  .group-chip.done{background:var(--green-bg);color:var(--green);}
  .trade-badge{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:4px;margin-left:6px;vertical-align:middle;}
  .trade-badge.build{background:#e4e6ea;color:#20242c;}
  .trade-badge.equip{background:#dbe9fb;color:#1a4fa0;}
  .trade-badge.elec{background:#fbdcdb;color:#a3241d;}
  .trade-legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px 0;font-size:11px;color:var(--ink-soft);}
  .trade-legend .lbl{font-weight:700;margin-right:2px;}
  .sheet-legend{display:flex;align-items:center;gap:10px;font-size:8.5px;color:#444;margin:4px 0 6px;}
  .sheet-legend .lbl{font-weight:700;margin-right:2px;}
  .sheet-legend .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:middle;}
  .check-row{background:var(--surface);border-radius:10px;margin-bottom:8px;padding:10px 12px;border:1px solid var(--line);}
  .check-row .item-name{font-size:13.5px;font-weight:700;margin-bottom:8px;color:var(--ink);}
  .confirm-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .confirm-btn{border-radius:8px;border:1.5px dashed var(--line);background:#fbfaf7;padding:8px 6px;text-align:center;}
  .confirm-btn .k{font-size:10px;color:var(--ink-soft);font-weight:500;letter-spacing:.02em;}
  .confirm-btn .v{font-size:12.5px;margin-top:3px;font-weight:700;color:var(--ink-soft);}
  .confirm-btn.filled{border-style:solid;}
  .confirm-btn.filled.vendor{border-color:var(--yellow);background:#fdf6e3;}
  .confirm-btn.filled.vendor .v{color:#8a5c00;}
  .confirm-btn.filled.staff{border-color:var(--green);background:var(--green-bg);}
  .confirm-btn.filled.staff .v{color:var(--green);}

  .qr-card{background:var(--surface);margin:16px 14px 0;border-radius:12px;border:1px solid var(--line);padding:16px;text-align:center;}
  .qr-card #qrbox{display:flex;justify-content:center;margin:8px 0;}
  .qr-card .hint{font-size:11px;color:var(--ink-soft);line-height:1.5;}
  .qr-card .link{font-size:10.5px;color:var(--navy);word-break:break-all;margin-top:6px;}

  /* ---- Import / labels views ---- */
  .panel{padding:16px 16px 40px;}
  .panel h2{font-family:'Barlow Condensed',sans-serif;font-size:24px;color:var(--navy);margin:6px 0 4px;}
  .panel p.desc{font-size:13px;color:var(--ink-soft);line-height:1.7;margin-bottom:16px;}
  .drop-zone{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;background:var(--surface);}
  .drop-zone input[type=file]{margin-top:10px;}
  textarea.csv-input{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:monospace;font-size:12px;margin-top:10px;}
  .panel-btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:11px 16px;font-size:13.5px;font-weight:700;margin-top:10px;}
  .panel-btn.orange{background:var(--orange);}
  .import-log{margin-top:14px;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;color:var(--ink-soft);}

  .label-sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:#fff;padding:12px;}
  .label{border:1px solid #999;border-radius:6px;padding:8px 4px;text-align:center;}

  .sheet-toggle{display:flex;gap:8px;margin:4px 0 14px;}
  .sheet-toggle button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:500;color:var(--ink-soft);}
  .sheet-toggle button.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  .sheet-page{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px 14px;margin-bottom:18px;box-shadow:0 2px 6px rgba(0,0,0,.06);}
  .sheet-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:6px;}
  .sheet-titlewrap{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .sheet-no{font-family:'Barlow Condensed',sans-serif;font-size:42px;font-weight:700;line-height:1;}
  .sheet-sub{font-size:14px;color:var(--ink-soft);}
  .sheet-qrwrap{text-align:center;}
  .sheet-qrwrap .cap{font-size:7.5px;color:var(--ink-soft);margin-top:2px;}
  .sheet-info{display:flex;gap:14px;margin:6px 0 6px;font-size:11px;flex-wrap:wrap;}
  .sheet-info span b{display:block;font-size:8.5px;color:var(--ink-soft);font-weight:500;}
  .sheet-info span{line-height:1.3;}
  .sheet-cols{display:flex;gap:10px;align-items:flex-start;}
  .sheet-col{flex:1;min-width:0;}
  table.sheet-table{width:100%;border-collapse:collapse;font-size:9.5px;table-layout:fixed;}
  table.sheet-table th{background:#eee;border:1px solid #999;padding:3px 2px;font-weight:700;font-size:8.8px;}
  table.sheet-table td{border:1px solid #999;padding:2.5px 3px;text-align:center;height:auto;line-height:1.25;}
  table.sheet-table td.name{text-align:left;font-weight:700;font-size:9.5px;white-space:normal;word-break:break-word;}
  table.sheet-table td.blank{color:#bbb;}
  table.sheet-table td.grouprow{background:#f0efe9;font-weight:700;text-align:left;padding:2px 5px;font-size:9px;}
  .sheet-foot{display:flex;justify-content:space-between;margin-top:6px;font-size:8.5px;color:var(--ink-soft);}

  @media print{
    .sheet-page{page-break-after:always;border:none;box-shadow:none;border-radius:0;margin:0;padding:6mm 5mm;}
    .sheet-page:last-child{page-break-after:auto;}
  }
  .label .no{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;}
  .label .qr{margin:4px auto;}

  @media print{
    .topbar,.filters,.no-print{display:none !important;}
    #app{max-width:none;}
  }

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .fab-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:flex;gap:2px;padding:4px;z-index:30;max-width:calc(100vw - 16px);}
  .fab-nav button{border:none;background:none;padding:8px 10px;border-radius:24px;font-size:11.5px;color:var(--ink-soft);font-weight:500;white-space:nowrap;flex-shrink:0;}
  .fab-nav button.active{background:var(--navy);color:#fff;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   居室チェック管理 — データモデル
   ========================================================= */
// 2026年8月改訂版チェック項目（進捗管理表_住戸前掲示用より）
// g = 工程番号（同じgの項目がひとかたまり。完了しても次工程はロックしない＝目安表示のみ）
// s = 工程内の枝番表示（1-1等）／ trade = 担当区分（build=建築[黒], equip=設備[青], elec=電気[赤]）
// ※ 2026-08改訂で旧15項目から全面差し替え。旧チェック記録（vd/vn/sd/sn）は互換性がないため
//   ITEMS_SCHEMA_VERSION を上げて起動時に全室分をリセットする（loadAll内でmigrateItemsSchema()）。
const ITEMS_SCHEMA_VERSION = 2;
const ITEMS = [
  {g:1,  s:'1-1',  trade:'build', ja:'墨出',                     ko:'먹매김'},
  {g:1,  s:'1-2',  trade:'equip', ja:'立管・墨出',                ko:'입상관・먹매김'},
  {g:1,  s:'1-3',  trade:'elec',  ja:'先行配線・墨出',             ko:'선행배선・먹매김'},
  {g:2,  s:'2-1',  trade:'build', ja:'ALC開口・コア',              ko:'ALC 개구부・코어'},
  {g:2,  s:'2-2',  trade:'build', ja:'SD・AWレベル',               ko:'SD・AW 레벨'},
  {g:2,  s:'2-3',  trade:'build', ja:'断熱モルタル',                ko:'단열 모르타르'},
  {g:3,  s:'3-1',  trade:'build', ja:'額縁・ピース付け',            ko:'몰딩・피스 설치'},
  {g:3,  s:'3-2',  trade:'equip', ja:'ダクト配管・保温・(SP)',       ko:'덕트 배관・보온・(SP)'},
  {g:3,  s:'3-3',  trade:'equip', ja:'転がし配管',                 ko:'바닥 노출배관'},
  {g:4,  s:'4-1',  trade:'build', ja:'ウレタン',                   ko:'우레탄'},
  {g:4,  s:'4-2',  trade:'equip', ja:'ウレタン後配管(ポリ・ダクト)', ko:'우레탄 후속배관(폴리・덕트)'},
  {g:5,  s:'5-1',  trade:'build', ja:'UB',                       ko:'UB(유닛욕조)'},
  {g:6,  s:'6-1',  trade:'build', ja:'UB枠・框',                  ko:'UB 틀・문틀'},
  {g:6,  s:'6-2',  trade:'build', ja:'先行LGS・PB',                ko:'선행 LGS・PB'},
  {g:7,  s:'7-1',  trade:'build', ja:'置床',                      ko:'이중바닥'},
  {g:8,  s:'8-1',  trade:'build', ja:'墨出',                      ko:'먹매김'},
  {g:8,  s:'8-2',  trade:'equip', ja:'墨出',                      ko:'먹매김'},
  {g:8,  s:'8-3',  trade:'elec',  ja:'墨出',                      ko:'먹매김'},
  {g:9,  s:'9-1',  trade:'build', ja:'LGS',                      ko:'LGS'},
  {g:9,  s:'9-2',  trade:'equip', ja:'間仕切り配管',                ko:'칸막이 배관'},
  {g:9,  s:'9-3',  trade:'elec',  ja:'BOX建込、配線',              ko:'박스 설치, 배선'},
  {g:10, s:'10-1', trade:'build', ja:'造作',                      ko:'목공사'},
  {g:11, s:'11-1', trade:'build', ja:'先付家具',                   ko:'선행 가구 설치'},
  {g:12, s:'12-1', trade:'build', ja:'PB',                       ko:'PB(석고보드)'},
  {g:12, s:'12-2', trade:'equip', ja:'ボード開口',                 ko:'보드 개구'},
  {g:12, s:'12-3', trade:'elec',  ja:'ボード開口',                 ko:'보드 개구'},
  {g:13, s:'13-1', trade:'build', ja:'キッチン',                   ko:'주방(키친)'},
  {g:14, s:'14-1', trade:'build', ja:'キッチンパネル',              ko:'키친 패널'},
  {g:15, s:'15-1', trade:'build', ja:'クロス',                    ko:'도배(벽지)'},
  {g:16, s:'16-1', trade:'build', ja:'床仕上げ(水廻り)',            ko:'바닥 마감(물 사용 공간)'},
  {g:17, s:'17-1', trade:'build', ja:'洗面化粧台',                 ko:'세면화장대'},
  {g:17, s:'17-2', trade:'equip', ja:'衛生器具',                   ko:'위생기구'},
  {g:17, s:'17-3', trade:'elec',  ja:'器具付け',                   ko:'기구 설치'},
  {g:18, s:'18-1', trade:'build', ja:'玄関タイル框',               ko:'현관 타일 문턱'},
  {g:19, s:'19-1', trade:'build', ja:'フローリング',                ko:'마루(플로어링)'},
  {g:20, s:'20-1', trade:'build', ja:'木巾木',                    ko:'목재 걸레받이'},
  {g:21, s:'21-1', trade:'build', ja:'雑金物',                    ko:'잡철물'},
  {g:21, s:'21-2', trade:'build', ja:'家具',                      ko:'가구'},
  {g:21, s:'21-3', trade:'build', ja:'木建扉',                    ko:'목재 도어(건구)'},
  {g:21, s:'21-4', trade:'equip', ja:'器具付け',                   ko:'기구 설치'},
  {g:21, s:'21-5', trade:'elec',  ja:'器具付け',                   ko:'기구 설치'},
  {g:22, s:'22-1', trade:'build', ja:'クリーニング',                ko:'청소(클리닝)'},
];
function itemName(idx){ const it = ITEMS[idx]; if(!it) return ''; return (LANG==='ko' ? it.ko : it.ja) || it.ja || ''; }

/* =========================================================
   多言語対応（日本語 / 韓国語）
   ---------------------------------------------------------
   ・現場の実データ（号室・フロア・メニュープラン・カラーセレクト・
     オプション・職員名・業者名など）は翻訳しない（そのまま入力された
     言語で表示する）。翻訳するのはアプリのUI文言と、固定の確認項目
     15件（ITEMS_KO）のみ。
   ・選択した言語は localStorage に保存し、次回起動時も引き継ぐ。
   ========================================================= */
let LANG = localStorage.getItem('qc_lang') || 'ja';
function setLang(lang){ LANG = lang; localStorage.setItem('qc_lang', lang); document.documentElement.lang = lang; render(); }
function t(key, vars){
  const dict = I18N[LANG] || I18N.ja;
  let s = (dict[key]!=null) ? dict[key] : (I18N.ja[key]!=null ? I18N.ja[key] : key);
  if(vars) Object.keys(vars).forEach(k=>{ s = s.split(`{${k}}`).join(vars[k]); });
  return s;
}

/* =========================================================
   権限管理（簡易ログイン）
   ---------------------------------------------------------
   ・「職員確認」「部屋情報の編集」「設定」「取込」など、記録に残す必要の
     ある操作はPINログインを要求する。
   ・「業者確認」は協力会社が自主的に入力する一次情報なので、従来通り
     ログイン無しで操作できる（最終判断は職員確認側で行う設計）。
   ・ログイン状態は sessionStorage に保存し、タブ／端末を閉じると消える
     （現場の共有タブレットを想定した「その場限りのログイン」）。
   ・注意：これはあくまでUI上の権限制御であり、本当の意味での改ざん防止
     には Firebase Database Rules 側での検証が必須（別途Firebase Console
     で設定する）。PINは平文で保存されるため、社外秘の強固な認証情報とは
     別のものとして運用すること。
   ========================================================= */
function getAuthed(){
  try{ const v = sessionStorage.getItem('qc_authed'); return v? JSON.parse(v): null; }catch(e){ return null; }
}
function setAuthed(user){ sessionStorage.setItem('qc_authed', JSON.stringify(user)); }
function clearAuthed(){ sessionStorage.removeItem('qc_authed'); }
function isAdmin(){ const u = getAuthed(); return !!(u && u.admin); }

function migrateStaffFormat(){
  if(!Array.isArray(SITE.staff) || !SITE.staff.length) return false;
  if(typeof SITE.staff[0] === 'object') return false; // 既に新形式
  const hadOldFormat = SITE.staff.some(s=>typeof s === 'string');
  // 先頭の職員を管理者にし、初期PINを付与する。
  // ここでPINを空にすると「ログインできない→設定画面も開けない」という
  // 締め出しが起きるため、必ず1人はログイン可能な状態で移行する。
  SITE.staff = SITE.staff.map((n,i)=>({name:n, pin: i===0 ? DEFAULT_ADMIN_PIN : '', admin:i===0}));
  return hadOldFormat;
}

/* 締め出し防止：PINを持つ職員が1人もいない場合、管理者に初期PINを復旧する。
   （旧バージョンで全員PIN空のまま保存されてしまったデータの救済も兼ねる） */
function repairStaffPins(){
  if(!Array.isArray(SITE.staff) || !SITE.staff.length){
    SITE.staff = DEFAULT_STAFF.slice();
    return true;
  }
  const anyPin = SITE.staff.some(s=>s && typeof s==='object' && (s.pin||'').trim());
  if(anyPin) return false;
  let adminIdx = SITE.staff.findIndex(s=>s && s.admin);
  if(adminIdx < 0) adminIdx = 0;
  SITE.staff[adminIdx].pin = DEFAULT_ADMIN_PIN;
  SITE.staff[adminIdx].admin = true;
  return true;
}

/* 職員ログイン（名前選択→PIN入力）。成功時はresolve({name,admin})、キャンセル時はresolve(null) */
function requireStaffLogin(promptText){

  if(already) return Promise.resolve(already);

}

function openLoginModal(promptText){
  return new Promise(resolve=>{
    const overlay = el(`<div style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:220;display:flex;align-items:center;justify-content:center;padding:20px;">
      <div style="background:#fff;border-radius:14px;padding:18px;width:100%;max-width:340px;">
        <div style="font-family:'Barlow Condensed';font-size:19px;color:var(--navy);margin-bottom:4px;">${t('loginModalTitle')}</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-bottom:12px;">${escapeHtml(promptText||'')}</div>
        <div id="loginNames" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;"></div>
        <div id="loginPinWrap" style="display:none;">
          <input id="loginPin" type="password" inputmode="numeric" maxlength="8" placeholder="${t('pinPlaceholder')}" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;letter-spacing:.1em;text-align:center;">
          <div id="loginErr" style="color:var(--red);font-size:11.5px;margin-top:6px;height:14px;"></div>
          <button class="panel-btn orange" id="loginOk" style="width:100%;margin-top:8px;">${t('loginOkBtn')}</button>
        </div>
        <button style="width:100%;margin-top:10px;background:none;border:none;color:var(--ink-soft);padding:8px;" id="loginCancel">${t('cancelBtn')}</button>
      </div>
    </div>`);
    let picked = null;
    const namesBox = overlay.querySelector('#loginNames');
    SITE.staff.forEach(s=>{
      const b = el(`<button style="border:1.5px solid var(--line);border-radius:20px;padding:8px 16px;font-size:13.5px;background:#fbfaf7;">${escapeHtml(s.name)}${s.admin?' 👑':''}</button>`);
      b.onclick = ()=>{
        picked = s;
        overlay.querySelector('#loginPinWrap').style.display='block';
        overlay.querySelector('#loginPin').value='';
        overlay.querySelector('#loginPin').focus();
      };
      namesBox.appendChild(b);
    });
    const tryLogin = ()=>{
      if(!picked) return;
      const pin = overlay.querySelector('#loginPin').value.trim();
      if((picked.pin||'') !== pin || !pin){
        overlay.querySelector('#loginErr').textContent = t('pinWrongError');
        return;
      }
      const user = {name:picked.name, admin:!!picked.admin};
      setAuthed(user);
      currentUser.name = picked.name; saveUser();
      document.body.removeChild(overlay);
      resolve(user);
    };
    overlay.querySelector('#loginOk').onclick = tryLogin;
    overlay.querySelector('#loginPin').addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
    overlay.querySelector('#loginCancel').onclick = ()=>{ document.body.removeChild(overlay); resolve(null); };
    document.body.appendChild(overlay);
  });
}

      vn: (src && src.vn) || '',
      sd: (src && src.sd) || '',
      sn: (src && src.sn) || ''
    });
  }
  return arr;
}

function roomFromSeed(s){
  return {
    plan: s.plan || '', color: s.color || '', opt: s.opt || '',
    items: ITEMS.map((n,i)=>({vd:'', vn:'', sd:'', sn:s.assign && s.assign[i] ? s.assign[i] : ''}))
  };
}

async function loadAll(){
  if(fbReady) await fbReady; // 匿名認証の完了を待ってからDB読み書きする
  MASTER = await Store.getMaster() || [];
  if(!MASTER.length){
    MASTER = SEED_ROOMS.map(s=>({no:s.no, floor:s.floor, building:s.building||'', plan:s.plan, color:s.color, opt:s.opt}));
    await saveMaster();
  }

  // 棟機能を追加する前に保存されたデータ等、building が抜けている部屋を
  // 号室から自動判定して自己修復する
  let healed = false;
  MASTER.forEach(m=>{
    if(!m.building){
      const b = inferBuilding(m.no) || (SEED_ROOMS.find(s=>String(s.no)===String(m.no))||{}).building;
      if(b){ m.building = b; healed = true; }
    }
  });
  if(healed) await saveMaster();

  const site = await Store.getSite();
  if(site) SITE = site;
  const migrated = migrateStaffFormat();
  // コード側の職員マスターを正とする同期。ROSTER_VERSIONが上がったときだけ
  // 既存のsite_configを上書きし、以降は設定画面での手編集を尊重する。
  let rosterSynced = false;
  if((SITE.staffRosterVersion||0) !== STAFF_ROSTER_VERSION){
    SITE.staff = DEFAULT_STAFF.map(s=>({...s}));
    SITE.staffRosterVersion = STAFF_ROSTER_VERSION;
    rosterSynced = true;
  }
  const repaired = repairStaffPins();
  if(migrated || repaired || rosterSynced) await saveSite();
  if(rosterSynced) setTimeout(()=>showToast(t('staffRosterSyncedFmt',{n:SITE.staff.length})), 600);
  else if(repaired) setTimeout(()=>showToast(t('pinRecoveredToast')), 600);

  // 2026-08改訂：チェック項目を15項目→23工程・42項目へ全面差し替え。
  // 旧項目とは対応関係がないため、スキーマ番号が古い場合は全室のチェック
  // 記録（vd/vn/sd/sn）だけを空にリセットする（部屋情報plan/color/optは維持）。
  const needsItemsReset = (SITE.itemsSchemaVersion||1) !== ITEMS_SCHEMA_VERSION;

  const ids = await Store.listRoomIds();
  const loadedNos = new Set();
  for(const id of ids){
    const r = await Store.getRoom(id);
    if(r){
      r.items = needsItemsReset ? emptyItems() : normalizeRoomItems(r.items);
      ROOMS[id] = r;
      loadedNos.add(String(id));
      if(needsItemsReset) await saveRoom(id); // サーバ側（Firebase）にも反映し、他端末にも波及させる
    }
  }
  // マスタにあるがまだ保存されていない部屋はシード or 空データで初期化
  for(const m of MASTER){
    if(!loadedNos.has(String(m.no))){
      const seed = SEED_ROOMS.find(s=>String(s.no)===String(m.no));
      ROOMS[m.no] = seed ? roomFromSeed(seed) : {plan:m.plan||'', color:m.color||'', opt:m.opt||'', items: emptyItems()};
    }
  }
  if(needsItemsReset){
    SITE.itemsSchemaVersion = ITEMS_SCHEMA_VERSION;
    await saveSite();
    showToast(t('itemsResetToast'));
  }
  const u = Store.getUser();
  if(u) currentUser = u;
}

const EAST_ROOM_NOS = new Set([819,733,734,633,634,635,533,534,535,536,433,434,435,436]);
function inferBuilding(no){
  const n = Number(no);
  if(!n) return '';
  if(EAST_ROOM_NOS.has(n)) return '東棟';
  const suffix = n % 100;
  if(suffix>=19 && suffix<=32) return '北棟';
  if(suffix>=1 && suffix<=18) return '南棟';
  return '';
}

async function addLog(entry){
  entry.ts = Date.now();
  const b = Store.backend();
  if(b==='firebase'){ try{ await fbDb.ref('logs').push(entry); }catch(e){ console.error('ログ保存失敗', e); } return; }
  const key='qc_logs';
  const arr = JSON.parse(localStorage.getItem(key)||'[]');
  arr.push(entry);
  localStorage.setItem(key, JSON.stringify(arr.slice(-1000)));
}
async function fetchLogs(limit){
  limit = limit || 300;
  const b = Store.backend();
  if(b==='firebase'){
    try{
      const snap = await fbDb.ref('logs').limitToLast(limit).get();
      if(!snap.exists()) return [];
      return Object.values(snap.val()).sort((a,b)=>b.ts-a.ts);
    }catch(e){ console.error('ログ取得失敗', e); return []; }
  }
  const arr = JSON.parse(localStorage.getItem('qc_logs')||'[]');
  return arr.slice(-limit).reverse();
}

/* =========================================================
   ステータス判定
   ========================================================= */
function roomStatus(no){
  const r = ROOMS[no];
  if(!r) return {done:0,vendor:0,total:ITEMS.length,state:'none'};
  const items = Array.isArray(r.items) ? r.items : normalizeRoomItems(r.items);
  let done=0, vendor=0;
  items.forEach(it=>{ if(it.sd) done++; else if(it.vd) vendor++; });
  let state = 'none';
  if(done===ITEMS.length) state='done';
  else if(done>0 || vendor>0) state='partial';
  return {done, vendor, total: ITEMS.length, state};
}

// 工程番号（ITEMS[].g）の並び順（重複除去）
const GROUP_NOS = [...new Set(ITEMS.map(it=>it.g))];

// 「ひとかたまり」単位の進捗（ロックはしない。目安表示のみ）
function groupStatus(room, g){
  const idxs = [];
  ITEMS.forEach((it,i)=>{ if(it.g===g) idxs.push(i); });
  const items = room.items;
  let done=0;
  idxs.forEach(i=>{ if(items[i] && items[i].sd) done++; });
  let state = 'none';
  if(done===idxs.length) state='done';
  else if(done>0) state='partial';
  return {done, total: idxs.length, state};
}

function overallProgress(){
  let done=0, total=0;
  MASTER.forEach(m=>{ const s=roomStatus(m.no); done+=s.done; total+=s.total; });
  return {done, total};
}

  const parts = h.split('/').filter(Boolean);
  if(parts[0]==='room' && parts[1]) return {view:'room', room:parts[1]};
  if(parts[0]==='import') return {view:'import'};
  if(parts[0]==='labels') return {view:'labels'};
  if(parts[0]==='settings') return {view:'settings'};
  if(parts[0]==='history') return {view:'history'};
  return {view:'dashboard'};
}

function escapeHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function truncateLabel(s, n){
  if(!s) return s;
  return s.length > n ? s.slice(0, n) + '…' : s;
}

    '企画住戸': '#E0E0E0'

async function toggleConfirm(no, idx, kind){
  const room = ROOMS[no];
  const it = room.items[idx];
  const itemNameJa = (ITEMS[idx]||{}).ja || ''; // 監査ログには言語に依存しない基準表記（日本語）で保存する
  let action, actor, prevValue;

  if(kind==='vendor'){
    // 業者確認：協力会社の一次申告なのでログインは要求しない（最終判断は職員確認側で行う）
    if(it.vd){
      const ok = await confirmDialog(t('vendorUnsetConfirmFmt',{val:`${it.vd} ${it.vn||''}`}));
      if(!ok) return;
      const prevVendorName = it.vn;
      prevValue = `${it.vd} ${it.vn||''}`.trim();
      it.vd=''; it.vn='';
      action='unset'; actor = (prevVendorName || t('unrecordedName')) + t('noLoginTag');
    } else {
      let name = getDeviceVendorName();
      if(!name){
        name = await promptVendorName(t('vendorNameFirstTimePrompt'));
        if(!name) return;
        setDeviceVendorName(name);
      }
      it.vd = todayStr(); it.vn = name;
      action='set'; actor = name;
    }
  } else {
    // 職員確認：品質判断の最終ゲートなので、PINログインした本人の名前でしか記録できないようにする
    const authed = await requireStaffLogin(t('staffConfirmLoginPrompt'));
    if(!authed) return;
    if(it.sd){
      const ok = await confirmDialog(t('staffUnsetConfirmFmt',{val:`${it.sd} ${it.sn||''}`, actor:authed.name}));
      if(!ok) return;
      prevValue = `${it.sd} ${it.sn||''}`.trim();
      it.sd=''; it.sn='';
      action='unset'; actor = authed.name;
    } else {
      it.sd = todayStr(); it.sn = authed.name; // 名前は選択式ではなく、ログイン中の本人固定
      action='set'; actor = authed.name;
    }
  }
  await saveRoom(no);
  await addLog({no:String(no), idx, item:itemNameJa, schema:ITEMS_SCHEMA_VERSION, kind, action, actor, prevValue: prevValue||''});
  render();
  showToast(t('updatedToast'));
}

function handleFileImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const logBox = document.getElementById('importLog');
  const reader = new FileReader();
  if(file.name.match(/\.csv$/i)){
    reader.onload = ()=>{
      const parsed = Papa.parse(reader.result.trim()).data.filter(r=>r.length>1 && r[0]);
      importRows(parsed, logBox);
    };
    reader.readAsText(file);
  } else {
    reader.onload = ()=>{
      try{
        const wb = XLSX.read(reader.result, {type:'array'});
        let rows = [];
        wb.SheetNames.forEach(sheetName=>{
          const ws = wb.Sheets[sheetName];
          const data = XLSX.utils.sheet_to_json(ws, {header:1});
          data.forEach(r=>{ if(r[0] && !isNaN(r[0])) rows.push([r[0], sheetName].concat(r.slice(1,4))); });
        });
        importRows(rows, logBox);
      }catch(err){
        logBox.style.display='block';
        logBox.textContent = t('importReadErrorFmt',{msg:err.message});
      }
    };
    reader.readAsArrayBuffer(file);
  }
}

async function importRows(rows, logBox){
  let added=0, updated=0;
  for(const r of rows){
    const no = String(r[0]).trim();
    if(!no || isNaN(no)) continue;
    const floor = (r[1]!=null && r[1]!=='') ? String(r[1]).trim() : (Math.floor(Number(no)/100)+'F');
    const plan = r[2]!=null ? String(r[2]).trim() : '';
    const color = r[3]!=null ? String(r[3]).trim() : '';
    const opt = r[4]!=null ? String(r[4]).trim() : '';
    const building = r[5]!=null ? String(r[5]).trim() : '';
    let m = MASTER.find(x=>String(x.no)===no);
    if(m){ m.floor=floor; m.plan=plan; m.color=color; m.opt=opt; if(building) m.building=building; updated++; }
    else { MASTER.push({no:Number(no)||no, floor, building, plan, color, opt}); added++; }
    if(!ROOMS[no]) ROOMS[no] = {plan, color, opt, items: emptyItems()};
    else { ROOMS[no].plan=plan; ROOMS[no].color=color; ROOMS[no].opt=opt; }
    await saveRoom(no);
  }
  await saveMaster();
  if(logBox){
    logBox.style.display='block';
    logBox.textContent = t('importDoneFmt',{added, updated, total:MASTER.length});
  }
  showToast(t('importedToast'));
}

    area.className = 'label-sheet';
    scoped.forEach(m=>{
      const box = el(`<div class="label"><div class="no">${m.no}</div><div class="qr" id="lbl-${m.no}"></div><div style="font-size:9px;color:#666;">${m.building||''} ${SITE.name}</div></div>`);
      area.appendChild(box);
    });
    setTimeout(()=>{
      scoped.forEach(m=>{
        const box = document.getElementById('lbl-'+m.no);
        if(box) new QRCode(box, {text: location.origin+location.pathname+'#/room/'+m.no, width:70, height:70});
      });
    }, 30);
  } else {
    // 42項目・22工程を1列で並べると縦に長すぎるため、工程（ひとかたまり）の
    // 区切りを保ったまま、件数がなるべく均等になる位置で左右2列に分割する。
    const groupCounts = GROUP_NOS.map(g => ITEMS.filter(it=>it.g===g).length);
    const totalCount = groupCounts.reduce((a,b)=>a+b,0);
    let running = 0, splitAt = GROUP_NOS.length;
    for(let i=0;i<GROUP_NOS.length;i++){
      running += groupCounts[i];
      if(running >= totalCount/2){ splitAt = i+1; break; }
    }
    const leftGroups = new Set(GROUP_NOS.slice(0, splitAt));
    const rightGroups = new Set(GROUP_NOS.slice(splitAt));

    function columnRowsHtml(room, groupSet){
      let lastGroupP = null;
      let html = '';
      ITEMS.forEach((meta, idx)=>{
        if(!groupSet.has(meta.g)) return;
        const it = room.items[idx] || {};
        const vendorCell = it.vd ? `${it.vd}<br>${it.vn||''}` : '';
        const staffCell = it.sd ? `${it.sd}<br>${it.sn||''}` : '';
        let groupRow = '';
        if(meta.g !== lastGroupP){
          lastGroupP = meta.g;
          groupRow = `<tr><td colspan="3" class="grouprow">${t('groupLabelFmt',{g:meta.g})}</td></tr>`;
        }
        const tradeColor = meta.trade==='equip' ? '#1a4fa0' : (meta.trade==='elec' ? '#a3241d' : 'inherit');
        html += `${groupRow}<tr>
          <td class="name" style="color:${tradeColor};">${meta.s}. ${itemName(idx)}</td>
          <td class="${it.vd?'':'blank'}">${vendorCell}</td>
          <td class="${it.sd?'':'blank'}">${staffCell}</td>
        </tr>`;
      });
      return html;
    }
    function columnTableHtml(room, groupSet){
      return `<table class="sheet-table">
        <thead><tr><th style="width:44%;">${t('sheetColItem')}</th><th>${t('sheetColVendor')}</th><th>${t('sheetColStaff')}</th></tr></thead>
        <tbody>${columnRowsHtml(room, groupSet)}</tbody>
      </table>`;
    }

    scoped.forEach(m=>{
      const room = ROOMS[m.no] || {plan:m.plan, color:m.color, opt:m.opt, items: emptyItems()};
      const page = el(`<div class="sheet-page">
        <div class="sheet-top">
          <div>
            <div class="sheet-titlewrap"><span class="sheet-no">${m.no}</span><span class="sheet-sub">${t('roomSuffixFmt',{loc:(m.building||'')+m.floor})}</span></div>
          </div>
          <div class="sheet-qrwrap"><div id="sheetqr-${m.no}"></div><div class="cap">${t('scanCaption')}</div></div>
        </div>
        <div class="sheet-info">
          <span><b>${t('fieldPlan')}</b>${escapeHtml(room.plan)}</span>
          <span><b>${t('fieldColor')}</b><span style="background:${colorTypeBg(room.color)};padding:1px 7px;border-radius:4px;">${escapeHtml(room.color)}</span></span>
          <span><b>${t('fieldOpt')}</b>${escapeHtml(room.opt)||'－'}</span>
        </div>
        <div class="sheet-legend">
          <span class="lbl">${t('tradeLegendTitle')}：</span>
          <span><span class="dot" style="background:#20242c;"></span>${t('tradeBuild')}</span>
          <span><span class="dot" style="background:#1a4fa0;"></span>${t('tradeEquip')}</span>
          <span><span class="dot" style="background:#a3241d;"></span>${t('tradeElec')}</span>
        </div>
        <div class="sheet-cols">
          <div class="sheet-col">${columnTableHtml(room, leftGroups)}</div>
          <div class="sheet-col">${columnTableHtml(room, rightGroups)}</div>
        </div>
        <div class="sheet-foot"><span>${SITE.name}</span><span>${t('printDateFmt',{d:todayStr()})}</span></div>
      </div>`);
      area.appendChild(page);
    });
    setTimeout(()=>{
      scoped.forEach(m=>{
        const box = document.getElementById('sheetqr-'+m.no);
        if(box) new QRCode(box, {text: location.origin+location.pathname+'#/room/'+m.no, width:64, height:64});
      });
    }, 30);
  }
  return holder;
}

/* =========================================================
   レンダリング — 操作履歴（監査ログ）
   ========================================================= */
function buildHistory(){
  const holder = document.createElement('div');
  const panel = el(`<div class="panel">
    <h2>${t('historyTitle')}</h2>
    <p class="desc">${t('historyDesc')}</p>
    <button class="panel-btn orange" id="btnExportLogs">${t('exportLogsBtn')}</button>
    <div id="historyList" style="margin-top:16px;"></div>
  </div>`);
  holder.appendChild(panel);

  panel.querySelector('#btnExportLogs').onclick = exportLogsCsv;

  const listBox = panel.querySelector('#historyList');
  listBox.innerHTML = `<div style="color:var(--ink-soft);font-size:13px;">${t('loadingLabel')}</div>`;
  fetchLogs(300).then(logs=>{
    if(!logs.length){ listBox.innerHTML = `<div style="color:var(--ink-soft);font-size:13px;">${t('noHistoryLabel')}</div>`; return; }
    listBox.innerHTML='';
    logs.forEach(l=>{
      const kindLabel = l.kind==='staff' ? t('labelStaffConfirm') : t('labelVendorConfirm');
      const actionLabel = l.action==='set' ? t('actionSet') : t('actionUnset');
      const color = l.action==='set' ? 'var(--green)' : 'var(--red)';
      const d = new Date(l.ts);
      const dateStr = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      const displayItem = (l.idx!=null && l.schema===ITEMS_SCHEMA_VERSION) ? itemName(l.idx) : (l.item||'');
      const row = el(`<div style="background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin-bottom:6px;font-size:12.5px;display:flex;justify-content:space-between;gap:10px;align-items:center;">
        <div>
          <div>${t('historyRoomLineFmt',{no:`<b>${l.no}</b>`, item:escapeHtml(displayItem), kind:kindLabel})}</div>
          <div style="color:var(--ink-soft);font-size:11.5px;">${escapeHtml(l.actor||'')} ／ ${dateStr}${l.prevValue?t('historyPrevValueFmt',{val:escapeHtml(l.prevValue)}):''}</div>
        </div>
        <div style="color:${color};font-weight:700;white-space:nowrap;">${actionLabel}</div>
      </div>`);
      listBox.appendChild(row);
    });
  });

  return holder;
}

async function exportLogsCsv(){
  const logs = await fetchLogs(5000);
  const rows = [t('csvLogHeads')];
  logs.forEach(l=>{
    const d = new Date(l.ts);
    const dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    const displayItem = (l.idx!=null && l.schema===ITEMS_SCHEMA_VERSION) ? itemName(l.idx) : (l.item||'');
    rows.push([dateStr, l.no, displayItem, l.kind==='staff'?t('labelStaffConfirm'):t('labelVendorConfirm'), l.action==='set'?t('actionSet'):t('actionUnset'), l.actor||'', l.prevValue||'']);
  });
  const csv = Papa.unparse(rows);
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `操作履歴_${SITE.name}_${todayStr().replace('/','-')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(t('logsExportedToast'));
}

/* =========================================================
   下部ナビ
   ========================================================= */
function buildFabNav(){
  const nav = el(`<div class="fab-nav no-print">
    <button data-v="dashboard">${t('navList')}</button>
    <button data-v="history">${t('navHistory')}</button>
    <button data-v="import">${t('navImport')}</button>
    <button data-v="labels">${t('navLabels')}</button>
    <button data-v="settings">${t('navSettings')}</button>
  </div>`);
  nav.querySelectorAll('button').forEach(b=>{
    if(b.dataset.v===route.view || (b.dataset.v==='dashboard' && route.view==='room')) b.classList.add('active');
    b.onclick = async ()=>{
      const v = b.dataset.v;
      if(ADMIN_ONLY_VIEWS.includes(v) && !isAdmin()){
        const authed = await openLoginModal(t('adminOnlyScreenPrompt'));
        if(!authed || !authed.admin){ if(authed) showToast(t('needAdminPermToast')); return; }
      } else if(STAFF_ONLY_VIEWS.includes(v) && !getAuthed()){
        const authed = await openLoginModal(t('staffOnlyScreenPrompt'));
        if(!authed) return;
      }
      go(v);
    };
  });
  return nav;
}

/* =========================================================
   起動
   ========================================================= */
(async function init(){
  document.documentElement.lang = LANG;
  document.getElementById('app').innerHTML = `<div class="empty-state">${t('loadingLabel')}</div>`;
  await loadAll();
  route = parseHash();
  render();
})();
</script>
