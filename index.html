<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>居室チェック管理 - 三交四日市</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>
  :root{
    --bg:#eceae2;
    --surface:#ffffff;
    --ink:#1b1d1e;
    --ink-soft:#5b5f61;
    --line:#cdc7b8;
    --navy:#14314f;
    --navy-deep:#0c2038;
    --orange:#e2711d;
    --yellow:#f0b429;
    --green:#2e7d46;
    --green-bg:#e4f1e7;
    --red:#b3261e;
    --red-bg:#f7e3e1;
    --grey-bg:#e2ded2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',sans-serif;-webkit-font-smoothing:antialiased;}
  .num{font-family:'Barlow Condensed',sans-serif;font-weight:700;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}
  ::selection{background:var(--yellow);}

  /* ---- App shell ---- */
  #app{max-width:960px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:40px;}

  .topbar{background:var(--navy);color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.18);}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .site-title{display:flex;flex-direction:column;line-height:1.1;}
  .site-title .eyebrow{font-size:11px;letter-spacing:.04em;color:#9db3c9;font-weight:500;}
  .site-title .name{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;letter-spacing:.01em;}
  .topbar-btns{display:flex;gap:6px;}
  .icon-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:7px 10px;font-size:12.5px;display:flex;align-items:center;gap:5px;white-space:nowrap;}
  .icon-btn:active{background:rgba(255,255,255,.22);}

  .progress-wrap{margin-top:12px;}
  .progress-num{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
  .progress-num .big{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;}
  .progress-num .sub{font-size:12px;color:#b9c7d5;}
  .progress-bar{height:8px;border-radius:5px;background:rgba(255,255,255,.16);overflow:hidden;display:flex;}
  .progress-bar>div{height:100%;}
  .progress-legend{display:flex;gap:14px;margin-top:8px;font-size:11px;color:#c7d3de;}
  .progress-legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  .filters{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--navy-deep);}
  .filters::-webkit-scrollbar{display:none;}
  .chip-filter{flex:0 0 auto;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#dbe4ec;border-radius:20px;padding:6px 14px;font-size:13px;font-weight:500;}
  .chip-filter.active{background:var(--orange);border-color:var(--orange);color:#fff;}

  .content{padding:14px 14px 0;}

  /* room grid */
  .floor-block{margin-bottom:18px;}
  .floor-head{display:flex;align-items:center;gap:8px;margin:0 2px 8px;}
  .floor-head .fnum{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;color:var(--navy);}
  .floor-head .fcount{font-size:11.5px;color:var(--ink-soft);}
  .room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;}
  .room-chip{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 6px 8px;text-align:center;position:relative;}
  .room-chip .no{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;line-height:1;}
  .room-chip .stat-label{font-size:10px;margin-top:4px;font-weight:500;}
  .room-chip .bar{height:4px;border-radius:2px;background:var(--grey-bg);margin-top:6px;overflow:hidden;}
  .room-chip .bar>div{height:100%;}
  .room-chip.st-none{border-color:var(--line);}
  .room-chip.st-vendor .no{color:var(--yellow-ink,#8a5c00);}
  .room-chip.st-partial{border-color:#e7c98a;}
  .room-chip.st-done{border-color:var(--green);background:var(--green-bg);}
  .room-chip .badge{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;}

  .empty-state{padding:60px 20px;text-align:center;color:var(--ink-soft);}
  .empty-state .big{font-family:'Barlow Condensed',sans-serif;font-size:22px;color:var(--navy);margin-bottom:8px;}
  .cta-btn{background:var(--orange);color:#fff;border:none;border-radius:8px;padding:11px 18px;font-size:14px;font-weight:700;margin-top:14px;}

  /* ---- Detail view ---- */
  .detail-header{background:var(--navy);color:#fff;padding:14px 16px 18px;}
  .back-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .back-btn{background:none;border:none;color:#cdd9e3;font-size:13px;display:flex;align-items:center;gap:4px;padding:4px 0;}
  .detail-title{display:flex;align-items:flex-end;justify-content:space-between;}
  .detail-title .no{font-family:'Barlow Condensed',sans-serif;font-size:52px;font-weight:700;line-height:1;}
  .detail-title .suffix{font-size:15px;color:#b9c7d5;margin-left:4px;}
  .detail-actions{display:flex;gap:6px;}

  .info-card{background:var(--surface);margin:-10px 14px 0;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.08);padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:2;}
  .info-field{display:flex;flex-direction:column;gap:2px;}
  .info-field.full{grid-column:1/-1;}
  .info-field label{font-size:10.5px;color:var(--ink-soft);font-weight:500;}
  .info-field input{border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-size:13.5px;font-family:inherit;background:#fbfaf7;}
  .info-field input:focus{outline:2px solid var(--orange);outline-offset:-1px;}

  .checklist{padding:14px 14px 0;}
  .check-row{background:var(--surface);border-radius:10px;margin-bottom:8px;padding:10px 12px;border:1px solid var(--line);}
  .check-row .item-name{font-size:13.5px;font-weight:700;margin-bottom:8px;color:var(--ink);}
  .confirm-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .confirm-btn{border-radius:8px;border:1.5px dashed var(--line);background:#fbfaf7;padding:8px 6px;text-align:center;}
  .confirm-btn .k{font-size:10px;color:var(--ink-soft);font-weight:500;letter-spacing:.02em;}
  .confirm-btn .v{font-size:12.5px;margin-top:3px;font-weight:700;color:var(--ink-soft);}
  .confirm-btn.filled{border-style:solid;}
  .confirm-btn.filled.vendor{border-color:var(--yellow);background:#fdf6e3;}
  .confirm-btn.filled.vendor .v{color:#8a5c00;}
  .confirm-btn.filled.staff{border-color:var(--green);background:var(--green-bg);}
  .confirm-btn.filled.staff .v{color:var(--green);}

  .qr-card{background:var(--surface);margin:16px 14px 0;border-radius:12px;border:1px solid var(--line);padding:16px;text-align:center;}
  .qr-card #qrbox{display:flex;justify-content:center;margin:8px 0;}
  .qr-card .hint{font-size:11px;color:var(--ink-soft);line-height:1.5;}
  .qr-card .link{font-size:10.5px;color:var(--navy);word-break:break-all;margin-top:6px;}

  /* ---- Import / labels views ---- */
  .panel{padding:16px 16px 40px;}
  .panel h2{font-family:'Barlow Condensed',sans-serif;font-size:24px;color:var(--navy);margin:6px 0 4px;}
  .panel p.desc{font-size:13px;color:var(--ink-soft);line-height:1.7;margin-bottom:16px;}
  .drop-zone{border:2px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;background:var(--surface);}
  .drop-zone input[type=file]{margin-top:10px;}
  textarea.csv-input{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:monospace;font-size:12px;margin-top:10px;}
  .panel-btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:11px 16px;font-size:13.5px;font-weight:700;margin-top:10px;}
  .panel-btn.orange{background:var(--orange);}
  .import-log{margin-top:14px;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;color:var(--ink-soft);}

  .label-sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:#fff;padding:12px;}
  .label{border:1px solid #999;border-radius:6px;padding:8px 4px;text-align:center;}

  .sheet-toggle{display:flex;gap:8px;margin:4px 0 14px;}
  .sheet-toggle button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font-size:12.5px;font-weight:500;color:var(--ink-soft);}
  .sheet-toggle button.active{background:var(--navy);border-color:var(--navy);color:#fff;}

  .sheet-page{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px 18px;margin-bottom:18px;box-shadow:0 2px 6px rgba(0,0,0,.06);}
  .sheet-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:8px;}
  .sheet-titlewrap{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .sheet-no{font-family:'Barlow Condensed',sans-serif;font-size:64px;font-weight:700;line-height:1;}
  .sheet-sub{font-size:20px;color:var(--ink-soft);}
  .sheet-qrwrap{text-align:center;}
  .sheet-qrwrap .cap{font-size:8.5px;color:var(--ink-soft);margin-top:2px;}
  .sheet-info{display:flex;gap:18px;margin:8px 0 10px;font-size:12px;flex-wrap:wrap;}
  .sheet-info span b{display:block;font-size:9.5px;color:var(--ink-soft);font-weight:500;}
  .sheet-info span{line-height:1.4;}
  table.sheet-table{width:100%;border-collapse:collapse;font-size:11px;}
  table.sheet-table th{background:#eee;border:1px solid #999;padding:4px 3px;font-weight:700;font-size:10.5px;}
  table.sheet-table td{border:1px solid #999;padding:5px 4px;text-align:center;height:22px;}
  table.sheet-table td.name{text-align:left;font-weight:700;font-size:11px;white-space:nowrap;}
  table.sheet-table td.blank{color:#bbb;}
  .sheet-foot{display:flex;justify-content:space-between;margin-top:8px;font-size:9.5px;color:var(--ink-soft);}

  @media print{
    .sheet-page{page-break-after:always;border:none;box-shadow:none;border-radius:0;margin:0;padding:8mm 6mm;}
    .sheet-page:last-child{page-break-after:auto;}
  }
  .label .no{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;}
  .label .qr{margin:4px auto;}

  @media print{
    .topbar,.filters,.no-print{display:none !important;}
    #app{max-width:none;}
  }

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .fab-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:flex;gap:2px;padding:4px;z-index:30;max-width:calc(100vw - 16px);}
  .fab-nav button{border:none;background:none;padding:8px 10px;border-radius:24px;font-size:11.5px;color:var(--ink-soft);font-weight:500;white-space:nowrap;flex-shrink:0;}
  .fab-nav button.active{background:var(--navy);color:#fff;}
</style>
</head>

function emptyItems(){

// Firebase Realtime DatabaseはnullをキーごとDeleteするため、未チェック状態は
// 必ず空文字列('')で保持する。壊れたデータ（旧null保存分・配列が欠けたもの）を
// 読み込んだ場合でも、常に15項目分の配列として復元する。
function normalizeRoomItems(raw){
  const arr = [];
  for(let i=0;i<ITEMS.length;i++){
    const src = (raw && typeof raw==='object') ? raw[i] : null;
    arr.push({
      vd: (src && src.vd) || '',
      vn: (src && src.vn) || '',
      sd: (src && src.sd) || '',
      sn: (src && src.sn) || ''
    });
  }
  return arr;
}

function roomFromSeed(s){
  return {
    plan: s.plan || '', color: s.color || '', opt: s.opt || '',
    items: ITEMS.map((n,i)=>({vd:'', vn:'', sd:'', sn:s.assign && s.assign[i] ? s.assign[i] : ''}))
  };
}

async function loadAll(){
  MASTER = await Store.getMaster() || [];
  if(!MASTER.length){
    MASTER = SEED_ROOMS.map(s=>({no:s.no, floor:s.floor, building:s.building||'', plan:s.plan, color:s.color, opt:s.opt}));
    await saveMaster();
  }

  // 棟機能を追加する前に保存されたデータ等、building が抜けている部屋を
  // 号室から自動判定して自己修復する
  let healed = false;
  MASTER.forEach(m=>{
    if(!m.building){
      const b = inferBuilding(m.no) || (SEED_ROOMS.find(s=>String(s.no)===String(m.no))||{}).building;
      if(b){ m.building = b; healed = true; }
    }
  });
  if(healed) await saveMaster();

  const site = await Store.getSite();
  if(site) SITE = site;

  const ids = await Store.listRoomIds();
  const loadedNos = new Set();
  for(const id of ids){
    const r = await Store.getRoom(id);
    if(r){ r.items = normalizeRoomItems(r.items); ROOMS[id] = r; loadedNos.add(String(id)); }
  }
  // マスタにあるがまだ保存されていない部屋はシード or 空データで初期化
  for(const m of MASTER){
    if(!loadedNos.has(String(m.no))){
      const seed = SEED_ROOMS.find(s=>String(s.no)===String(m.no));
      ROOMS[m.no] = seed ? roomFromSeed(seed) : {plan:m.plan||'', color:m.color||'', opt:m.opt||'', items: emptyItems()};
    }
  }
  const u = Store.getUser();
  if(u) currentUser = u;
}

// 京王多摩川開発B棟の号室体系から棟を推定（building欠損時のフォールバック）
const EAST_ROOM_NOS = new Set([819,733,734,633,634,635,533,534,535,536,433,434,435,436]);
function inferBuilding(no){
  const n = Number(no);
  if(!n) return '';
  if(EAST_ROOM_NOS.has(n)) return '東棟';
  const suffix = n % 100;
  if(suffix>=19 && suffix<=32) return '北棟';
  if(suffix>=1 && suffix<=18) return '南棟';
  return '';
}

async function saveMaster(){ await Store.setMaster(MASTER); }

async function saveRoom(no){ await Store.setRoom(no, ROOMS[no]); }
async function saveUser(){ Store.setUser(currentUser); }

/* =========================================================
   ステータス判定
   ========================================================= */
function roomStatus(no){
  const r = ROOMS[no];
  if(!r) return {done:0,vendor:0,total:ITEMS.length,state:'none'};
  const items = Array.isArray(r.items) ? r.items : normalizeRoomItems(r.items);
  let done=0, vendor=0;
  items.forEach(it=>{ if(it.sd) done++; else if(it.vd) vendor++; });
  let state = 'none';
  if(done===ITEMS.length) state='done';
  else if(done>0 || vendor>0) state='partial';
  return {done, vendor, total: ITEMS.length, state};
}

function overallProgress(){
  let done=0, total=0;
  MASTER.forEach(m=>{ const s=roomStatus(m.no); done+=s.done; total+=s.total; });
  return {done, total};
}

function parseHash(){
  const h = location.hash.replace('#','');
  const parts = h.split('/').filter(Boolean);
  if(parts[0]==='room' && parts[1]) return {view:'room', room:parts[1]};
  if(parts[0]==='import') return {view:'import'};
  if(parts[0]==='labels') return {view:'labels'};
  if(parts[0]==='settings') return {view:'settings'};
  return {view:'dashboard'};
}
window.addEventListener('hashchange', ()=>{ route = parseHash(); render(); window.scrollTo(0,0); });

function go(view, room){
  location.hash = view==='dashboard' ? '' : (view==='room' ? '#/room/'+room : '#/'+view);
}

  }
  const content = el(`<div class="content"></div>`);
  const scopedByBuilding = buildingFilter==='all' ? MASTER : MASTER.filter(m=>m.building===buildingFilter);
  const floors = [...new Set(scopedByBuilding.map(m=>m.floor))].sort((a,b)=>parseInt(a)-parseInt(b));
  const list = floorFilter==='all' ? floors : [floorFilter];
  list.forEach(f=>{
    const rooms = scopedByBuilding.filter(m=>m.floor===f).sort((a,b)=>a.no-b.no);
    if(!rooms.length) return;
    // 同じフロア表記が複数棟にまたがる場合は棟ごとに分けて表示
    const byBuilding = {};
    rooms.forEach(r=>{ const b=r.building||''; (byBuilding[b]=byBuilding[b]||[]).push(r); });
    Object.keys(byBuilding).forEach(b=>{
      const list2 = byBuilding[b];
      const doneCount = list2.filter(r=>roomStatus(r.no).state==='done').length;
      const label = (buildingFilter==='all' && b) ? `${f}（${b}）` : f;
      const block = el(`<div class="floor-block">
        <div class="floor-head"><span class="fnum">${label}</span><span class="fcount">${doneCount}/${list2.length} 室 完了</span></div>
        <div class="room-grid"></div>
      </div>`);
      const grid = block.querySelector('.room-grid');
      list2.forEach(r=>{
        const s = roomStatus(r.no);
        const pct = s.total ? Math.round(s.done/s.total*100) : 0;
        let cls='st-none', barColor='#8a95a5';
        if(s.state==='done'){cls='st-done';barColor='var(--green)';}
        else if(s.state==='partial'){cls='st-partial';barColor='var(--yellow)';}
        const chip = el(`<button class="room-chip ${cls}">
            <div class="no">${r.no}</div>
            <div class="stat-label">${s.done}/${s.total}</div>
            <div class="bar"><div style="width:${pct}%;background:${barColor}"></div></div>
          </button>`);
        chip.onclick = ()=>go('room', r.no);
        grid.appendChild(chip);
      });
      content.appendChild(block);
    });
  });
  holder.appendChild(content);
  return holder;
}

function escapeHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function toggleConfirm(no, idx, kind){
  const room = ROOMS[no];
  const it = room.items[idx];
  if(kind==='vendor'){
    if(it.vd){
      const ok = await confirmDialog(`「業者確認（${it.vd} ${it.vn||''}）」を取り消しますか？`);
      if(!ok) return;
      it.vd=''; it.vn='';
    } else {
      const name = await pickName(SITE.vendors, '業者を選択');
      if(name===null) return;
      it.vd = todayStr(); it.vn = name;
    }
  } else {
    if(it.sd){
      const ok = await confirmDialog(`「職員確認（${it.sd} ${it.sn||''}）」を取り消しますか？`);
      if(!ok) return;
      it.sd=''; it.sn='';
    } else {
      const name = await pickName(SITE.staff, '確認職員を選択');
      if(name===null) return;
      it.sd = todayStr(); it.sn = name;
    }
  }
  await saveRoom(no);
  render();
  showToast('更新しました');
}

function handleFileImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const logBox = document.getElementById('importLog');
  const reader = new FileReader();
  if(file.name.match(/\.csv$/i)){
    reader.onload = ()=>{
      const parsed = Papa.parse(reader.result.trim()).data.filter(r=>r.length>1 && r[0]);
      importRows(parsed, logBox);
    };
    reader.readAsText(file);
  } else {
    reader.onload = ()=>{
      try{
        const wb = XLSX.read(reader.result, {type:'array'});
        let rows = [];
        wb.SheetNames.forEach(sheetName=>{
          const ws = wb.Sheets[sheetName];
          const data = XLSX.utils.sheet_to_json(ws, {header:1});
          data.forEach(r=>{ if(r[0] && !isNaN(r[0])) rows.push([r[0], sheetName].concat(r.slice(1,4))); });
        });
        importRows(rows, logBox);
      }catch(err){
        logBox.style.display='block';
        logBox.textContent = '読み込みエラー: '+err.message;
      }
    };
    reader.readAsArrayBuffer(file);
  }
}

async function importRows(rows, logBox){
  let added=0, updated=0;
  for(const r of rows){
    const no = String(r[0]).trim();
    if(!no || isNaN(no)) continue;
    const floor = (r[1]!=null && r[1]!=='') ? String(r[1]).trim() : (Math.floor(Number(no)/100)+'F');
    const plan = r[2]!=null ? String(r[2]).trim() : '';
    const color = r[3]!=null ? String(r[3]).trim() : '';
    const opt = r[4]!=null ? String(r[4]).trim() : '';
    const building = r[5]!=null ? String(r[5]).trim() : '';
    let m = MASTER.find(x=>String(x.no)===no);
    if(m){ m.floor=floor; m.plan=plan; m.color=color; m.opt=opt; if(building) m.building=building; updated++; }
    else { MASTER.push({no:Number(no)||no, floor, building, plan, color, opt}); added++; }
    if(!ROOMS[no]) ROOMS[no] = {plan, color, opt, items: emptyItems()};
    else { ROOMS[no].plan=plan; ROOMS[no].color=color; ROOMS[no].opt=opt; }
    await saveRoom(no);
  }
  await saveMaster();
  if(logBox){
    logBox.style.display='block';
    logBox.textContent = `取り込み完了：新規 ${added}室 / 更新 ${updated}室 / 合計 ${MASTER.length}室`;
  }
  showToast('取り込みました');
}

function exportCsv(){
  const rows = [['号室','フロア','メニュープラン','カラーセレクト','オプション','棟']];
  MASTER.sort((a,b)=>a.no-b.no).forEach(m=>rows.push([m.no,m.floor,m.plan,m.color,m.opt,m.building||'']));
  const csv = Papa.unparse(rows);
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'room_master.csv';
  a.click();
  URL.revokeObjectURL(url);
}

    <p class="desc no-print">全${scoped.length}室分${scopeLabel}。上部の棟・フロアの絞り込みで印刷範囲を変えられます。</p>
    <div class="sheet-toggle no-print">
      <button data-m="sheet" class="${printMode==='sheet'?'active':''}">掲示用チェックシート（A4・1室1枚）</button>
      <button data-m="label" class="${printMode==='label'?'active':''}">QRラベル（小・シール用）</button>
    </div>
    <button class="panel-btn no-print" onclick="window.print()">🖨 印刷する</button>
    <div id="printArea" style="margin-top:16px;"></div>
  </div>`);
  panel.querySelectorAll('.sheet-toggle button').forEach(b=>{
    b.onclick = ()=>{ printMode = b.dataset.m; render(); };
  });
  holder.appendChild(panel);
  const area = panel.querySelector('#printArea');

  if(printMode==='label'){
    area.className = 'label-sheet';
    scoped.forEach(m=>{
      const box = el(`<div class="label"><div class="no">${m.no}</div><div class="qr" id="lbl-${m.no}"></div><div style="font-size:9px;color:#666;">${m.building||''} ${SITE.name}</div></div>`);
      area.appendChild(box);
    });
    setTimeout(()=>{
      scoped.forEach(m=>{
        const box = document.getElementById('lbl-'+m.no);
        if(box) new QRCode(box, {text: location.origin+location.pathname+'#/room/'+m.no, width:70, height:70});
      });
    }, 30);
  } else {
    scoped.forEach(m=>{
      const room = ROOMS[m.no] || {plan:m.plan, color:m.color, opt:m.opt, items: emptyItems()};
      const rowsHtml = ITEMS.map((name, idx)=>{
        const it = room.items[idx] || {};
        const vendorCell = it.vd ? `${it.vd}<br>${it.vn||''}` : '';
        const staffCell = it.sd ? `${it.sd}<br>${it.sn||''}` : '';
        return `<tr>
          <td class="name">${idx+1}. ${name}</td>
          <td class="${it.vd?'':'blank'}">${vendorCell}</td>
          <td class="${it.sd?'':'blank'}">${staffCell}</td>
        </tr>`;
      }).join('');
      const page = el(`<div class="sheet-page">
        <div class="sheet-top">
          <div>
            <div class="sheet-titlewrap"><span class="sheet-no">${m.no}</span><span class="sheet-sub">号室 ／ ${m.building||''}${m.floor}</span></div>
          </div>
          <div class="sheet-qrwrap"><div id="sheetqr-${m.no}"></div><div class="cap">スキャンでWEB版へ</div></div>
        </div>
        <div class="sheet-info">
          <span><b>メニュープラン</b>${escapeHtml(room.plan)}</span>
          <span><b>カラーセレクト</b><span style="background:${colorTypeBg(room.color)};padding:1px 7px;border-radius:4px;">${escapeHtml(room.color)}</span></span>
          <span><b>オプション</b>${escapeHtml(room.opt)||'－'}</span>
        </div>
        <table class="sheet-table">
          <thead><tr><th style="width:38%;">確認事項</th><th>業者確認（日付／確認者）</th><th>職員確認（日付／確認者）</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
        <div class="sheet-foot"><span>${SITE.name}</span><span>印刷日：${todayStr()}</span></div>
      </div>`);
      area.appendChild(page);
    });
    setTimeout(()=>{
      scoped.forEach(m=>{
        const box = document.getElementById('sheetqr-'+m.no);
        if(box) new QRCode(box, {text: location.origin+location.pathname+'#/room/'+m.no, width:128, height:128});
      });
    }, 30);
  }
  return holder;
}

/* =========================================================
   下部ナビ
   ========================================================= */
function buildFabNav(){
  const nav = el(`<div class="fab-nav no-print">
    <button data-v="dashboard">一覧</button>
    <button data-v="import">取込</button>
    <button data-v="labels">掲示・印刷</button>
    <button data-v="settings">設定</button>
  </div>`);
  nav.querySelectorAll('button').forEach(b=>{
    if(b.dataset.v===route.view || (b.dataset.v==='dashboard' && route.view==='room')) b.classList.add('active');
    b.onclick = ()=>go(b.dataset.v);
  });
  return nav;
}

/* =========================================================
   起動
   ========================================================= */
(async function init(){
  document.getElementById('app').innerHTML = '<div class="empty-state">読み込み中...</div>';
  await loadAll();
  route = parseHash();
  render();
})();
</script>
</body>
</html>
